name: Settlements EEX

on:
  schedule:
    - cron: "0 5 * * *"        # tous les jours à 05:00
      timezone: "Europe/Paris"   # heure de Paris, été comme hiver
  workflow_dispatch:             # bouton "Run workflow" pour lancer à la main

permissions:
  contents: read                 # le code n'est que lu ; l'historique est poussé dans le dépôt de données

concurrency:
  group: settlements-eex
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Récupérer l'historique (dépôt privé menckley/settlements-eex-data, dans data/)
        uses: actions/checkout@v4
        with:
          repository: menckley/settlements-eex-data
          token: ${{ secrets.DATA_REPO_TOKEN }}   # jeton GitHub : Contents en lecture et écriture sur ce dépôt
          path: data

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les settlements, stocker l'historique et envoyer l'e-mail
        run: python rapport_settlements.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Committer l'historique dans le dépôt de données
        if: always()                 # l'historique est conservé même si l'envoi du mail échoue
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau à stocker"
          else
            git commit -m "Historique settlements EEX $(date -u +%Y-%m-%d)"
            git push
          fi
