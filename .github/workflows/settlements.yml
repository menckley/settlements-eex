name: Settlements EEX

on:
  schedule:
    - cron: "0 8 * * *"        # du lundi au vendredi à 9h00
      timezone: "Europe/Paris"   # heure de Paris, été comme hiver
  workflow_dispatch:             # bouton "Run workflow" pour lancer à la main

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les settlements et envoyer l'e-mail
        run: python rapport_settlements.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
